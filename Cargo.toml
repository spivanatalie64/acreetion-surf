[package]
name = "acreetion-surf"
version = "2.0.0"
edition = "2021"
authors = ["Natalie's twin"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"